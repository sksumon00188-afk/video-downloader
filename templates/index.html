<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১-ক্লিক ভিডিও ও সাবটাইটেল ডাউনলোডার</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d131f; color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #172133; border-radius: 16px; padding: 35px; width: 100%; max-width: 580px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #00c6ff; font-size: 22px; margin-bottom: 8px; }
        p.subtitle { color: #8fa0bc; font-size: 13px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px 16px; border-radius: 8px; border: 1px solid #2d3e5a; background: #0d1524; color: #fff; font-size: 14px; margin-bottom: 15px; outline: none; }
        
        /* অপশন বাটন স্টাইল */
        .options-panel { display: flex; gap: 12px; margin-bottom: 15px; }
        .opt-btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-video { background: linear-gradient(90deg, #00d2ff 0%, #0066ff 100%); }
        .btn-sub { background: linear-gradient(90deg, #a855f7 0%, #6366f1 100%); }
        .opt-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .opt-btn:disabled { background: #475569; cursor: not-allowed; transform: none; }

        .status-msg { display: none; margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 13px; }
        .status-msg.info { background: #1e293b; color: #38bdf8; display: block; }
        .status-msg.error { background: #3b1424; color: #f87171; display: block; }
        .status-msg.success { background: #143823; color: #4ade80; display: block; }
        .footer { margin-top: 25px; font-size: 12px; color: #64748b; }
        .footer span { color: #00c6ff; }
    </style>
</head>
<body>

<div class="container">
    <h1>১-ক্লিক ভিডিও ও সাবটাইটেল ডাউনলোডার</h1>
    <p class="subtitle">YouTube, Facebook, Instagram বা যেকোনো লিংক দিন</p>

    <input type="text" id="videoUrl" placeholder="এখানে ভিডিও লিংক পেস্ট করুন...">

    <div class="options-panel">
        <button id="btnVideo" class="opt-btn btn-video" onclick="triggerDownload('video')">🎬 ভিডিও ডাউনলোড</button>
        <button id="btnSub" class="opt-btn btn-sub" onclick="triggerDownload('subtitle')">📝 সাবটাইটেল ডাউনলোড</button>
    </div>

    <div id="statusAlert" class="status-msg"></div>

    <div class="footer">
        Developer: <span>সুমন শেখ</span><br>
        Contact / WhatsApp: <span>01883878688</span>
    </div>
</div>

<script>
    async function triggerDownload(mode) {
        const urlInput = document.getElementById('videoUrl');
        const alertBox = document.getElementById('statusAlert');
        const btnVideo = document.getElementById('btnVideo');
        const btnSub = document.getElementById('btnSub');
        const url = urlInput.value.trim();

        if (!url) {
            alertBox.className = "status-msg error";
            alertBox.innerText = "দয়া করে একটি ভিডিও লিংক পেস্ট করুন!";
            return;
        }

        btnVideo.disabled = true;
        btnSub.disabled = true;
        alertBox.className = "status-msg info";
        alertBox.innerText = mode === 'video' ? "ভিডিও প্রসেস করা হচ্ছে, অপেক্ষা করুন..." : "সাবটাইটেল খোঁজা হচ্ছে...";

        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, mode: mode })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.message || "ডাউনলোড ব্যর্থ হয়েছে!");
            }

            // ফাইল ব্রাউজারে ডাউনলোড হিসেবে সেভ করা
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            
            const header = response.headers.get('Content-Disposition');
            let filename = mode === 'video' ? "video.mp4" : "subtitle.srt";
            if (header && header.includes('filename=')) {
                filename = header.split('filename=')[1].replace(/["']/g, '');
            }
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            alertBox.className = "status-msg success";
            alertBox.innerText = "ডাউনলোড সফল হয়েছে!";
        } catch (err) {
            alertBox.className = "status-msg error";
            alertBox.innerText = err.message;
        } finally {
            btnVideo.disabled = false;
            btnSub.disabled = false;
        }
    }
</script>

</body>
</html>
