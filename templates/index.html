<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১-ক্লিক ভিডিও ও সাবটাইটেল ডাউনলোডার</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 35px 25px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00d2ff;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-video {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: white;
        }
        .btn-sub {
            background: linear-gradient(90deg, #9d50bb 0%, #6e48aa 100%);
            color: white;
        }
        .message-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            word-break: break-word;
        }
        .message-box.error {
            display: block;
            background-color: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #ff7b72;
        }
        .message-box.info {
            display: block;
            background-color: rgba(56, 139, 253, 0.15);
            border: 1px solid rgba(56, 139, 253, 0.4);
            color: #58a6ff;
        }
        .footer {
            margin-top: 15px;
            font-size: 13px;
            color: #58a6ff;
        }
        .footer span {
            color: #8b949e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>১-ক্লিক ভিডিও ও সাবটাইটেল ডাউনলোডার</h1>
    <p class="subtitle">YouTube, Facebook, Instagram বা যেকোনো লিংক দিন</p>

    <input type="text" id="videoUrl" placeholder="ভিডিও লিংক এখানে পেস্ট করুন..." autocomplete="off">

    <div class="btn-group">
        <button id="btnVideo" class="btn-video" onclick="startDownload('/download-video', 'ভিডিও')">🎬 ভিডিও ডাউনলোড</button>
        <button id="btnSub" class="btn-sub" onclick="startDownload('/download-subtitle', 'সাবটাইটেল')">📝 সাবটাইটেল ডাউনলোড</button>
    </div>

    <div id="msgBox" class="message-box"></div>

    <div class="footer">
        <span>Developer:</span> সুমন শেখ <br>
        <span>Contact / WhatsApp:</span> 01883878688
    </div>
</div>

<script>
    async function startDownload(endpoint, typeName) {
        const urlInput = document.getElementById('videoUrl');
        const url = urlInput.value.trim();
        const msgBox = document.getElementById('msgBox');
        const btnVideo = document.getElementById('btnVideo');
        const btnSub = document.getElementById('btnSub');

        if (!url) {
            msgBox.className = 'message-box error';
            msgBox.innerText = 'দয়া করে একটি ভিডিওর লিংক দিন!';
            return;
        }

        btnVideo.disabled = true;
        btnSub.disabled = true;
        msgBox.className = 'message-box info';
        msgBox.innerText = `${typeName} প্রসেস করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...`;

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url: url })
            });

            const contentType = response.headers.get("content-type") || "";

            if (!response.ok) {
                if (contentType.includes("application/json")) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'ডাউনলোড ব্যর্থ হয়েছে!');
                } else {
                    const textErr = await response.text();
                    throw new Error('সার্ভারে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।');
                }
            }

            // ফাইল ডাউনলোড প্রক্রিয়া শুরু
            const blob = await response.blob();
            let filename = `${typeName}_download`;
            const disposition = response.headers.get('Content-Disposition');
            if (disposition && disposition.indexOf('filename=') !== -1) {
                const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(disposition);
                if (matches != null && matches[1]) { 
                    filename = matches[1].replace(/['"]/g, '');
                }
            }

            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = decodeURIComponent(filename);
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            msgBox.className = 'message-box info';
            msgBox.innerText = `সফলভাবে ${typeName} ডাউনলোড সম্পন্ন হয়েছে!`;
        } catch (error) {
            msgBox.className = 'message-box error';
            msgBox.innerText = error.message;
        } finally {
            btnVideo.disabled = false;
            btnSub.disabled = false;
        }
    }
</script>

</body>
</html>
